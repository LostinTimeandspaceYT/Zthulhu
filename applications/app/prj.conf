# USB Device Configuration (New Stack)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y

# USB Device Descriptors (Adafruit VID/PID)
CONFIG_SAMPLE_USBD_VID=0x239A
CONFIG_SAMPLE_USBD_PID=0x8123
CONFIG_SAMPLE_USBD_MANUFACTURER="Adafruit Industries LLC"
CONFIG_SAMPLE_USBD_PRODUCT="Metro RP2350"

# Serial and Console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_STDOUT_CONSOLE=y

# Display and LVGL
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_24=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y

CONFIG_LV_Z_MEM_POOL_SIZE=16384


# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_DEFERRED=y
# Reduce noise from display/LVGL
CONFIG_DISPLAY_LOG_LEVEL_WRN=y
CONFIG_LV_USE_LOG=n
# Silence I2C errors while debugging SD
CONFIG_I2C_LOG_LEVEL_OFF=y

# JSON
CONFIG_JSON_LIBRARY=y

# File system (SD card via SPI on Metro RP2350 onboard slot)
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_SDHC=y
CONFIG_SDHC_LOG_LEVEL_DBG=y
CONFIG_SDMMC_STACK=y
# Note: DISK_DRIVER_SDMMC not needed - devicetree zephyr,sdmmc-disk handles it
CONFIG_FILE_SYSTEM=y
CONFIG_FS_LOG_LEVEL_DBG=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_LOG_LEVEL_DBG=y

# Memory management
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
